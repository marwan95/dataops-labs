version: 2

models:

  - name: fct_order_details
    description: >
      Grain: one row per order line item. Joins stg_order_items with stg_orders,
      stg_products, and stg_customers to produce the core analytical fact table.
      Materialised as incremental (unique_key = order_item_id) with a 3-day
      look-back window. Includes currency-converted revenue via the
      convert_currency macro and a surrogate key generated by dbt_utils.
    columns:
      - name: order_detail_sk
        description: >
          Surrogate primary key — MD5 hash of order_id + order_item_id generated
          by dbt_utils.generate_surrogate_key. Uniquely identifies each row across
          full and incremental loads.
      - name: order_item_id
        description: Natural key for the order line item from the source system.
      - name: order_id
        description: Foreign key to stg_orders; groups line items belonging to the same order.
      - name: order_date
        description: Date the order was placed. Indexed for fast time-range filtering.
      - name: order_status
        description: >
          Current lifecycle status of the order.
          Accepted values: pending, shipped, completed, returned, cancelled.
      - name: store_id
        description: Foreign key to stg_store_locations identifying the fulfilling store.
      - name: product_id
        description: Foreign key to stg_products.
      - name: product_name
        description: Display name of the product at the time of the order.
      - name: category
        description: Product category (e.g. Laptops, Peripherals, Furniture).
      - name: customer_id
        description: >
          Foreign key to stg_customers. Indexed for fast customer-level aggregations.
      - name: first_name
        description: Customer's first name at the time of the order.
      - name: last_name
        description: Customer's last name at the time of the order.
      - name: email
        description: Customer's email address.
      - name: quantity
        description: Number of units of the product ordered on this line.
      - name: unit_price
        description: List price per unit in the product's source currency.
      - name: discount_pct
        description: Percentage discount applied to this line item (0–100 scale).
      - name: shipping_fee
        description: Shipping fee charged for the parent order, in order currency.
      - name: currency
        description: ISO 4217 currency code for the product (USD, OMR, or EUR).
      - name: gross_amount
        description: quantity × unit_price before discount, in source currency.
      - name: net_amount
        description: >
          Revenue after discount: quantity × unit_price × (1 − discount_pct / 100).
          Computed by the calculate_revenue macro.
      - name: total_amount
        description: net_amount + shipping_fee in source currency.
      - name: net_amount_usd
        description: >
          net_amount converted to USD using fixed exchange rates
          (OMR × 2.60, EUR × 1.08) via the convert_currency macro.

  - name: dim_customers
    description: >
      Customer dimension table aggregating lifetime order metrics per customer.
      One row per customer. Joins stg_customers with fct_order_details to compute
      total_orders and total_spent. Indexed on country for geographic filtering.
    columns:
      - name: customer_id
        description: Unique customer identifier — primary key of this dimension.
      - name: first_name
        description: Customer's first name.
      - name: last_name
        description: Customer's last name.
      - name: email
        description: Customer's email address (should be unique per customer).
      - name: phone
        description: Customer's phone number.
      - name: signup_date
        description: Date the customer registered.
      - name: country
        description: Customer's country of residence. Indexed for geographic segmentation.
      - name: city
        description: Customer's city of residence.
      - name: total_orders
        description: Lifetime count of order line items attributed to this customer.
      - name: total_spent
        description: Lifetime sum of total_amount across all orders for this customer.

  - name: fct_monthly_revenue
    description: >
      Pivoted monthly revenue table with one row per store and one column per
      calendar month (jan_revenue … dec_revenue). Covers the target year defined
      in the Jinja {% set target_year %} variable. Revenue is calculated using the
      calculate_revenue macro and filtered to completed order line items.
      Uses dbt_utils.star() to select order columns and a {% for %} loop to
      generate the 12 monthly CASE WHEN pivot columns.

  - name: quarantine_orders
    description: >
      Captures order rows that fail critical data-quality checks so they can be
      investigated without polluting the main analytical models. Each row includes
      the full order record plus a failure_reason column explaining why it was
      quarantined. Current rules: future_order_date, null_customer_id,
      invalid_customer_id, negative_shipping_fee.
    columns:
      - name: failure_reason
        description: >
          Short code describing why the row was quarantined.
          Values: future_order_date, null_customer_id, invalid_customer_id,
          negative_shipping_fee.
